services:
  db:
    image: postgres:15
    container_name: postgres_audit
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-audit_system}
      POSTGRES_USER: ${DB_USER:-user_audit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: